name: Actualizar y publicar monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      reiniciar_estado:
        description: "Ignorar el histórico guardado y partir de cero"
        type: boolean
        default: false

# Permisos mínimos por trabajo (principio de menor privilegio).
permissions:
  contents: read

# Una sola corrida a la vez: evita que dos actualizaciones se pisen el estado.
concurrency:
  group: monitor-uaf
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write   # solo para escribir la rama monitor-state
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar histórico desde la rama monitor-state
        if: ${{ inputs.reiniciar_estado != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git clone --quiet --depth 1 --branch monitor-state \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" estado_previo; then
            [ -f estado_previo/datos.json ] && cp estado_previo/datos.json datos.json || true
            [ -f estado_previo/.monitor_estado.json ] && cp estado_previo/.monitor_estado.json .monitor_estado.json || true
            echo "Histórico restaurado."
          else
            echo "Sin rama monitor-state todavía: primera corrida."
          fi
          rm -rf estado_previo

      - name: Ejecutar monitor
        env:
          # Presupuesto de tiempo interno, inferior al timeout del job.
          MONITOR_PRESUPUESTO_SEG: "780"
          MONITOR_HILOS: "6"
          MONITOR_BARRIDO: "70"
          MONITOR_RESPETA_ROBOTS: "true"
          # Correo (configúralos en Settings → Secrets and variables → Actions)
          MONITOR_CORREO_ACTIVO: ${{ secrets.MONITOR_CORREO_ACTIVO }}
          MONITOR_SMTP_SERVIDOR: ${{ secrets.MONITOR_SMTP_SERVIDOR }}
          MONITOR_SMTP_PUERTO: ${{ secrets.MONITOR_SMTP_PUERTO }}
          MONITOR_SMTP_SEGURIDAD: ${{ secrets.MONITOR_SMTP_SEGURIDAD }}
          MONITOR_SMTP_USUARIO: ${{ secrets.MONITOR_SMTP_USUARIO }}
          MONITOR_SMTP_CLAVE: ${{ secrets.MONITOR_SMTP_CLAVE }}
          MONITOR_DESTINATARIOS: ${{ secrets.MONITOR_DESTINATARIOS }}
          MONITOR_REMITENTE_NOMBRE: ${{ secrets.MONITOR_REMITENTE_NOMBRE }}
          MONITOR_MINIMO_AVISO: ${{ secrets.MONITOR_MINIMO_AVISO }}
          MONITOR_SILENCIO_MINUTOS: ${{ secrets.MONITOR_SILENCIO_MINUTOS }}
          MONITOR_SOLO_UAF: ${{ secrets.MONITOR_SOLO_UAF }}
        run: python3 monitor_uaf.py

      - name: Construir sitio estático
        run: python3 construye_sitio.py

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Guardar histórico en la rama monitor-state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f datos.json ] || exit 0
          rm -rf estado_nuevo
          mkdir estado_nuevo
          cp datos.json estado_nuevo/
          [ -f .monitor_estado.json ] && cp .monitor_estado.json estado_nuevo/ || true
          cd estado_nuevo
          git init --quiet
          git checkout --quiet -b monitor-state
          git config user.name "monitor-uaf[bot]"
          git config user.email "monitor-uaf@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Estado del monitor $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          # Rama de un solo commit: el repositorio no crece con 96 corridas al día.
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
