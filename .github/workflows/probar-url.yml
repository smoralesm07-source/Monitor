name: Probar URL Monitor UAF

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la noticia a probar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probar-url:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Ejecutar diagnóstico de URL
        env:
          URL_PRUEBA: ${{ inputs.url }}
        shell: bash
        run: |
          set -o pipefail
          python3 -u monitor_uaf.py --probar-url "$URL_PRUEBA" 2>&1 | tee prueba_url.log

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-url-${{ github.run_number }}
          path: |
            prueba_url.log
          if-no-files-found: warn
          retention-days: 7
