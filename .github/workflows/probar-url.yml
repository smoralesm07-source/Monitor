- name: Descargar HTML recibido
  env:
    URL_PRUEBA: ${{ inputs.url }}
  shell: bash
  run: |
    python3 - <<'PY'
    import os
    import requests

    url = os.environ["URL_PRUEBA"]
    headers = {
        "User-Agent": "Mozilla/5.0 (compatible; MonitorUAF/8.4; +https://github.com/)"
    }

    respuesta = requests.get(
        url,
        headers=headers,
        timeout=30,
        allow_redirects=True
    )

    print("HTTP:", respuesta.status_code)
    print("URL final:", respuesta.url)
    print("Bytes:", len(respuesta.content))
    print("Content-Type:", respuesta.headers.get("content-type"))

    with open("pagina_recibida.html", "wb") as archivo:
        archivo.write(respuesta.content)
    PY
