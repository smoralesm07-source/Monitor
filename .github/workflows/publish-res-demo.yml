name: Publicar demo RES junto al Monitor

on:
  push:
    branches: [main]
    paths:
      - 'res-demo/**'
      - '.github/workflows/publish-res-demo.yml'
  workflow_run:
    workflows: ['Actualizar y publicar monitor UAF']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar rama principal
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Recuperar último estado del Monitor
        uses: actions/checkout@v6
        with:
          ref: monitor-state
          path: _state

      - name: Reconstruir sitio e integrar demo RES
        shell: bash
        run: |
          set -euxo pipefail
          test -s _state/datos.json
          test -s index.html
          test -s construye_sitio.py
          test -s res-demo/index.html
          test -s res-demo/app.js
          test -s res-demo/data.js
          test -s res-demo/insights.js
          test -s res-demo/entities.js
          test -s res-demo/support-entities.js
          test -s res-demo/support.js
          test -s res-demo/entity-app.js
          test -s res-demo/style.css
          test -s res-demo/entity.css
          test -s res-demo/support.css
          test -s res-demo/atlas-contract.json
          test -s res-demo/ATLAS_INTEGRATION.md

          node --check res-demo/app.js
          node --check res-demo/data.js
          node --check res-demo/insights.js
          node --check res-demo/entities.js
          node --check res-demo/support-entities.js
          node --check res-demo/support.js
          node --check res-demo/entity-app.js
          python3 -m json.tool res-demo/atlas-contract.json >/dev/null
          grep -q 'Fenómenos observables' res-demo/index.html
          grep -q 'entitySearch' res-demo/index.html
          grep -q 'entityDrawer' res-demo/index.html
          grep -q 'entityExplorer' res-demo/index.html
          grep -q 'criticalDates' res-demo/index.html
          grep -q 'similarNames' res-demo/index.html
          grep -q 'support-entities.js' res-demo/index.html
          grep -q 'support.js' res-demo/index.html
          grep -q 'support.css' res-demo/index.html
          grep -q 'chileMap' res-demo/index.html
          grep -q '"version": "6.0.0"' res-demo/atlas-contract.json
          ! grep -Eqi 'representante común|socio común|red societaria|beneficiario final' res-demo/app.js

          cp _state/datos.json datos.json
          python3 construye_sitio.py
          python3 generar_resumen.py --entrada datos.json --salida resumen.json

          rm -rf public/res-demo
          cp -a res-demo public/res-demo
          touch public/.nojekyll

          test -s public/index.html
          test -s public/datos.json
          test -s public/res-demo/index.html
          test -s public/res-demo/app.js
          test -s public/res-demo/data.js
          test -s public/res-demo/insights.js
          test -s public/res-demo/entities.js
          test -s public/res-demo/support-entities.js
          test -s public/res-demo/support.js
          test -s public/res-demo/entity-app.js
          test -s public/res-demo/entity.css
          test -s public/res-demo/support.css
          test -s public/res-demo/atlas-contract.json
          echo 'Demo RES v6 integrada al artefacto Pages.'

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
