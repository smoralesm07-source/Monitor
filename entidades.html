<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entidades y relaciones · Monitor UAF Chile</title>
<style>
/* Los colores codifican la NATURALEZA JURÍDICA: es información estructural,
   no decoración. El analista debe distinguir de un vistazo una persona natural
   de una jurídica, tanto en la ficha como en el grafo. */
:root{
  --fondo:#101725; --panel:#18202F; --panel-alto:#1F2939;
  --borde:#2A3547; --borde-vivo:#3A4A63;
  --texto:#E8EDF5; --texto-medio:#A6B2C4; --texto-tenue:#6F7D92;
  --natural:#F0B429; --juridica:#3FBFAE; --publico:#9B8CFA;
  --tribunal:#F0709B; --sinfines:#5BA8F5; --lugar:#7E8CA3; --otro:#5E6B80;
  --alerta:#FF8A65; --r:10px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--juridica)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100vh}
@media (max-width:960px){.app{grid-template-columns:1fr;height:auto}.lista{max-height:44vh}}

.lista{border-right:1px solid var(--borde);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.lista header{padding:16px 16px 12px;border-bottom:1px solid var(--borde)}
.marca{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--texto-tenue);margin:0 0 6px}
.marca b{color:var(--natural);font-weight:600}
.lista h1{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.buscador{width:100%;padding:8px 10px;border-radius:8px;background:var(--fondo);
  border:1px solid var(--borde-vivo);color:var(--texto);font-family:inherit}
.buscador:focus{outline:2px solid var(--juridica);outline-offset:1px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.filtro{padding:3px 9px;border-radius:999px;border:1px solid var(--borde-vivo);
  background:transparent;color:var(--texto-medio);font-size:11.5px;font-family:var(--mono)}
.filtro[aria-pressed="true"]{background:var(--juridica);border-color:var(--juridica);color:#062B27}
.noticias{overflow-y:auto;flex:1;min-height:0}
.noticia{width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--borde);padding:12px 16px;display:block}
.noticia:hover{background:var(--panel-alto)}
.noticia[aria-current="true"]{background:var(--panel-alto);box-shadow:inset 3px 0 0 var(--natural)}
.noticia .meta{font-family:var(--mono);font-size:10.5px;color:var(--texto-tenue);
  display:flex;gap:8px;margin-bottom:4px}
.noticia .tit{font-size:13px;line-height:1.4;color:var(--texto)}
.noticia .conteo{margin-top:6px;display:flex;gap:10px;font-family:var(--mono);
  font-size:10.5px;color:var(--texto-medio)}
.punto{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}

.detalle{overflow-y:auto;padding:22px 26px 60px;min-width:0}
.vacio{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--texto-tenue);text-align:center;gap:8px;padding:40px}
.cabecera h2{font-size:21px;line-height:1.3;margin:0 0 8px;letter-spacing:-.015em}
.cabecera .sub{font-family:var(--mono);font-size:11.5px;color:var(--texto-medio);
  display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.resumen{color:var(--texto-medio);margin:14px 0 0;max-width:74ch}
.seccion{margin-top:30px}
.seccion>h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--texto-tenue);margin:0 0 12px;
  display:flex;align-items:center;gap:10px}
.seccion>h3::after{content:"";flex:1;height:1px;background:var(--borde)}

.grupo{margin-bottom:20px}
.grupo-tit{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:var(--texto-medio);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.fichas{display:grid;gap:8px}
.ficha{border:1px solid var(--borde);border-left:3px solid var(--otro);
  border-radius:var(--r);background:var(--panel);overflow:hidden}
.ficha>summary{padding:10px 13px;cursor:pointer;display:flex;align-items:center;
  gap:10px;list-style:none}
.ficha>summary::-webkit-details-marker{display:none}
.ficha .nom{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;
  border:1px solid var(--borde-vivo);color:var(--texto-medio);white-space:nowrap}
.ficha .score{font-family:var(--mono);font-size:11px;color:var(--texto-tenue)}
.ficha .cuerpo{padding:11px 13px 13px;border-top:1px solid var(--borde);margin:2px 0 0}
.campo{display:flex;gap:10px;margin-bottom:7px;font-size:12.5px}
.campo dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--texto-tenue);min-width:100px;
  flex-shrink:0;padding-top:2px}
.campo dd{margin:0;color:var(--texto-medio);min-width:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:var(--fondo);border:1px solid var(--borde);color:var(--texto-medio)}
.cita{border-left:2px solid var(--borde-vivo);padding-left:10px;
  color:var(--texto-medio);font-size:12.5px;margin:0 0 6px}
.aviso{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10.5px;color:var(--alerta);border:1px solid var(--alerta);
  border-radius:5px;padding:1px 7px}
.acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.accion{padding:4px 10px;border-radius:7px;border:1px solid var(--borde-vivo);
  background:transparent;color:var(--texto-medio);font-size:11.5px;font-family:var(--mono)}
.accion:hover{border-color:var(--juridica);color:var(--juridica)}

.grafo-caja{border:1px solid var(--borde);border-radius:var(--r);
  background:var(--panel);position:relative;overflow:hidden}
.grafo-barra{display:flex;gap:8px;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--borde);flex-wrap:wrap}
.grafo-barra .hint{font-family:var(--mono);font-size:10.5px;
  color:var(--texto-tenue);margin-left:auto}
svg.grafo{display:block;width:100%;height:460px;touch-action:none;cursor:grab}
svg.grafo.arrastrando{cursor:grabbing}
.nodo{cursor:pointer}
.nodo circle{stroke:var(--fondo);stroke-width:2}
.nodo:focus{outline:none}
.nodo:focus circle{stroke:#FFF;stroke-width:3}
.nodo.externo circle{stroke-dasharray:3 2;stroke:var(--texto-tenue)}
.nodo text{font-family:var(--mono);font-size:10px;fill:var(--texto-medio);
  pointer-events:none;paint-order:stroke;stroke:var(--fondo);stroke-width:3px}
.arista{stroke:var(--borde-vivo);stroke-width:1.4}
.arista.explicita{stroke:var(--juridica);stroke-width:2}
.arista.puente{stroke:var(--natural);stroke-dasharray:4 3}
.arista-tit{font-family:var(--mono);font-size:9px;fill:var(--texto-tenue);pointer-events:none}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;padding:9px 12px;
  border-top:1px solid var(--borde);font-family:var(--mono);
  font-size:10.5px;color:var(--texto-tenue)}
.nota{margin-top:26px;padding:12px 14px;border:1px solid var(--borde);
  border-radius:var(--r);color:var(--texto-tenue);font-size:12px;max-width:82ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="lista">
    <header>
      <p class="marca">Monitor <b>UAF</b> · Chile</p>
      <h1>Entidades por noticia</h1>
      <input class="buscador" id="q" type="search" placeholder="Buscar noticia, medio o entidad" aria-label="Buscar">
      <div class="filtros" id="filtros"></div>
    </header>
    <div class="noticias" id="noticias" role="list"></div>
  </aside>
  <main class="detalle" id="detalle">
    <div class="vacio"><p>Elige una noticia para ver sus entidades.</p></div>
  </main>
</div>

<script>
"use strict";

var COLOR = {
  PERSONA:"var(--natural)", EMPRESA:"var(--juridica)",
  INSTITUCION_FINANCIERA:"var(--juridica)", ORGANISMO_PUBLICO:"var(--publico)",
  TRIBUNAL:"var(--tribunal)", ENTIDAD_SIN_FINES_DE_LUCRO:"var(--sinfines)",
  ORGANIZACION:"var(--sinfines)", LUGAR:"var(--lugar)"
};
var ETIQUETA_TIPO = {
  PERSONA:"Persona", EMPRESA:"Empresa",
  INSTITUCION_FINANCIERA:"Institución financiera",
  ORGANISMO_PUBLICO:"Organismo público", TRIBUNAL:"Tribunal",
  ENTIDAD_SIN_FINES_DE_LUCRO:"Sin fines de lucro", ORGANIZACION:"Organización",
  LUGAR:"Territorio", MONTO:"Monto", CRIPTOACTIVO:"Criptoactivo",
  RUT:"RUT", NOTICIA:"Noticia", OTRO:"Otro"
};
var ORDEN_GRUPO = [
  ["PERSONA_NATURAL","Personas naturales"],
  ["PERSONA_JURIDICA","Personas jurídicas"],
  ["NO_APLICA","Territorios, montos y otros datos"]
];

var ARTICULOS = [];
var INDICE_ENTIDAD = new Map();
var SELECCION = null;
var FILTRO_NATURALEZA = null;
var EXPANDIDOS = new Set();
var sim = null;

function $(s){ return document.querySelector(s); }
function esc(t){
  return String(t === null || t === undefined ? "" : t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function cargar(){
  fetch("datos.json", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(iniciar)
    .catch(function(err){
      $("#detalle").innerHTML =
        '<div class="vacio"><p>No se pudo leer <code>datos.json</code>.</p>' +
        '<p style="font-size:12px;max-width:48ch">Publica la carpeta con GitHub Pages o ' +
        'sírvela con un servidor local. Al abrir el archivo con file:// el navegador ' +
        'bloquea la lectura.</p><p style="font-size:11px">Detalle: ' + esc(err.message) + '</p></div>';
    });
}

function iniciar(datos){
  ARTICULOS = (datos.prensa || []).filter(function(a){ return (a.entidades||[]).length; });
  ARTICULOS.sort(function(a,b){ return String(b.fecha||"").localeCompare(String(a.fecha||"")); });
  INDICE_ENTIDAD = new Map();
  ARTICULOS.forEach(function(art){
    (art.entidades||[]).forEach(function(e){
      if(!INDICE_ENTIDAD.has(e.id)) INDICE_ENTIDAD.set(e.id, []);
      INDICE_ENTIDAD.get(e.id).push(art.id);
    });
  });
  pintarFiltros();
  pintarLista();
  if(ARTICULOS.length) seleccionar(ARTICULOS[0].id);
}

function pintarFiltros(){
  var opciones = [["PERSONA_NATURAL","Personas"],["PERSONA_JURIDICA","Jurídicas"]];
  $("#filtros").innerHTML = opciones.map(function(o){
    return '<button class="filtro" data-nat="'+o[0]+'" aria-pressed="false">'+o[1]+'</button>';
  }).join("");
  $("#filtros").addEventListener("click", function(ev){
    var b = ev.target.closest(".filtro"); if(!b) return;
    FILTRO_NATURALEZA = FILTRO_NATURALEZA === b.dataset.nat ? null : b.dataset.nat;
    Array.prototype.forEach.call($("#filtros").children, function(x){
      x.setAttribute("aria-pressed", String(x.dataset.nat === FILTRO_NATURALEZA));
    });
    pintarLista();
  });
}

function cuenta(art, naturaleza){
  return (art.entidades||[]).filter(function(e){ return e.naturaleza === naturaleza; }).length;
}

function pintarLista(){
  var q = ($("#q").value || "").trim().toLowerCase();
  var visibles = ARTICULOS.filter(function(a){
    if(FILTRO_NATURALEZA && !cuenta(a, FILTRO_NATURALEZA)) return false;
    if(!q) return true;
    var heno = [a.titulo, a.medio].concat((a.entidades||[]).map(function(e){
      return e.nombre_canonico; })).join(" ").toLowerCase();
    return heno.indexOf(q) !== -1;
  });
  $("#noticias").innerHTML = visibles.length ? visibles.map(function(a){
    return '<button class="noticia" role="listitem" data-id="'+esc(a.id)+'" aria-current="'+(a.id===SELECCION)+'">'
      + '<div class="meta"><span>'+esc(a.fecha||"")+'</span><span>'+esc(a.medio||"")+'</span></div>'
      + '<div class="tit">'+esc(a.titulo||"Sin título")+'</div>'
      + '<div class="conteo">'
      + '<span><i class="punto" style="background:var(--natural)"></i>'+cuenta(a,"PERSONA_NATURAL")+' naturales</span>'
      + '<span><i class="punto" style="background:var(--juridica)"></i>'+cuenta(a,"PERSONA_JURIDICA")+' jurídicas</span>'
      + '</div></button>';
  }).join("") : '<p style="padding:18px 16px;color:var(--texto-tenue);font-size:12.5px">Ninguna noticia coincide con la búsqueda.</p>';
  Array.prototype.forEach.call($("#noticias").querySelectorAll(".noticia"), function(b){
    b.addEventListener("click", function(){ seleccionar(b.dataset.id); });
  });
}

function campo(k, v){ return '<div class="campo"><dt>'+k+'</dt><dd>'+v+'</dd></div>'; }

function ficha(e, art){
  var otras = (INDICE_ENTIDAD.get(e.id)||[]).filter(function(x){ return x !== art.id; });
  var roles = (e.roles||[]).map(function(r){ return r.rol || r; }).filter(Boolean);
  var ctx = (e.contextos||[]).slice(0,3).map(function(c){
    return '<p class="cita">'+esc(typeof c === "string" ? c : (c.texto || c.frase || ""))+'</p>'; }).join("");
  return '<details class="ficha" style="border-left-color:'+(COLOR[e.tipo]||"var(--otro)")+'">'
    + '<summary><span class="nom">'+esc(e.nombre_canonico)+'</span>'
    + '<span class="badge">'+esc(ETIQUETA_TIPO[e.tipo]||e.tipo)+'</span>'
    + '<span class="score">'+Number(e.confianza_score||0).toFixed(2)+'</span>'
    + (e.requiere_validacion ? '<span class="aviso">validar</span>' : "")
    + '</summary><dl class="cuerpo">'
    + (roles.length ? campo("Rol en el texto", '<div class="chips">'+roles.map(function(r){
        return '<span class="chip">'+esc(r)+'</span>'; }).join("")+'</div>') : "")
    + ((e.ruts||[]).length ? campo("RUT asociado", e.ruts.map(function(r){
        return esc(r.rut)+' <span class="chip">'+esc(r.confianza)+'</span>'; }).join(" ")) : "")
    + ((e.variantes||[]).length > 1 ? campo("Cómo se nombra", '<div class="chips">'+e.variantes.map(function(v){
        return '<span class="chip">'+esc(v)+'</span>'; }).join("")+'</div>') : "")
    + ((e.formas_unificadas||[]).length ? campo("Formas unificadas", '<div class="chips">'+e.formas_unificadas.map(function(v){
        return '<span class="chip">'+esc(v.variante||v)+'</span>'; }).join("")+'</div>') : "")
    + campo("Menciones", (e.menciones||1)+" en esta noticia")
    + (ctx ? campo("Evidencia", ctx) : "")
    + ((e.senales||[]).length ? campo("Por qué se clasificó así", '<div class="chips">'+e.senales.map(function(s){
        return '<span class="chip">'+esc(s)+'</span>'; }).join("")+'</div>') : "")
    + (otras.length ? '<div class="acciones"><button class="accion" data-expandir="'+esc(e.id)+'">'
        + 'Aparece en '+otras.length+' noticia'+(otras.length>1?"s":"")+' más — mostrar en el grafo</button></div>' : "")
    + '</dl></details>';
}

function seleccionar(id){
  SELECCION = id;
  EXPANDIDOS = new Set();
  pintarLista();
  var art = null;
  for(var i=0;i<ARTICULOS.length;i++){ if(ARTICULOS[i].id === id){ art = ARTICULOS[i]; break; } }
  if(!art) return;

  var grupos = ORDEN_GRUPO.map(function(g){
    var items = (art.entidades||[]).filter(function(e){
      return (e.naturaleza||"INDETERMINADA") === g[0]; });
    if(!items.length) return "";
    items.sort(function(a,b){ return (b.confianza_score||0) - (a.confianza_score||0); });
    return '<div class="grupo"><p class="grupo-tit">'
      + '<i class="punto" style="background:'+(COLOR[items[0].tipo]||"var(--otro)")+'"></i>'
      + g[1]+' · '+items.length+'</p><div class="fichas">'
      + items.map(function(e){ return ficha(e, art); }).join("")+'</div></div>';
  }).join("");

  $("#detalle").innerHTML =
      '<div class="cabecera"><h2>'+esc(art.titulo||"Sin título")+'</h2><div class="sub">'
    + '<span>'+esc(art.medio||"")+'</span><span>'+esc(art.fecha||"")+'</span>'
    + (art.fenomeno_label ? '<span class="badge">'+esc(art.fenomeno_label)+'</span>' : "")
    + (art.link ? '<a href="'+esc(art.link)+'" target="_blank" rel="noopener">Ver publicación original</a>' : "")
    + '</div>'+(art.resumen ? '<p class="resumen">'+esc(art.resumen)+'</p>' : "")+'</div>'
    + '<section class="seccion"><h3>Red de esta noticia</h3><div class="grafo-caja">'
    + '<div class="grafo-barra"><button class="accion" id="reacomodar">Reacomodar</button>'
    + '<button class="accion" id="expandir-todo">Abrir vínculos con otras noticias</button>'
    + '<span class="hint">Arrastra los nodos · doble clic para abrir sus otras noticias</span></div>'
    + '<svg class="grafo" id="svg" role="img" aria-label="Grafo de relaciones de la noticia"></svg>'
    + '<div class="leyenda" id="leyenda"></div></div></section>'
    + '<section class="seccion"><h3>Entidades identificadas</h3>'
    + (grupos || '<p style="color:var(--texto-tenue)">Sin entidades en esta noticia.</p>')
    + '</section>'
    + '<p class="nota">Que una entidad aparezca aquí significa únicamente que fue nombrada en la '
    + 'publicación. No implica participación, responsabilidad ni vínculo delictivo. Las relaciones '
    + 'se infieren de frases del texto y requieren validación antes de cualquier uso institucional.</p>';

  Array.prototype.forEach.call($("#detalle").querySelectorAll("[data-expandir]"), function(b){
    b.addEventListener("click", function(){ alternarExpansion(b.dataset.expandir); });
  });
  $("#reacomodar").addEventListener("click", function(){ dibujarGrafo(art, true); });
  $("#expandir-todo").addEventListener("click", function(){
    var conVecinas = (art.entidades||[]).filter(function(e){
      return (INDICE_ENTIDAD.get(e.id)||[]).length > 1; }).map(function(e){ return e.id; });
    var todos = conVecinas.length > 0 && conVecinas.every(function(id){ return EXPANDIDOS.has(id); });
    EXPANDIDOS = todos ? new Set() : new Set(conVecinas);
    dibujarGrafo(art);
  });
  dibujarGrafo(art, true);
  $("#detalle").scrollTop = 0;
}

function alternarExpansion(id){
  if(EXPANDIDOS.has(id)) EXPANDIDOS.delete(id); else EXPANDIDOS.add(id);
  for(var i=0;i<ARTICULOS.length;i++){
    if(ARTICULOS[i].id === SELECCION){ dibujarGrafo(ARTICULOS[i]); return; }
  }
}

/* Grafo dirigido por fuerzas, sin dependencias externas: el sitio debe seguir
   funcionando sin conexión. Al abrir una entidad se incorporan las otras
   noticias donde aparece, que es el movimiento que permite seguir un hilo a
   través del corpus de prensa. */
function construirRed(art){
  var nodos = new Map(), aristas = [];
  (art.entidades||[]).forEach(function(e){
    if(e.tipo === "MONTO" || e.tipo === "FECHA") return;
    nodos.set(e.id, {id:e.id, nombre:e.nombre_canonico, tipo:e.tipo,
      externo:false, peso:e.menciones||1});
  });
  (art.relaciones_entidades||[]).forEach(function(r){
    if(nodos.has(r.origen) && nodos.has(r.destino)){
      aristas.push({o:r.origen, d:r.destino, tipo:"explicita", etiqueta:r.etiqueta||""});
    }
  });
  var ids = Array.from(nodos.keys());
  var unidos = new Set();
  aristas.forEach(function(a){ unidos.add(a.o+"|"+a.d); unidos.add(a.d+"|"+a.o); });
  for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++){
    if(!unidos.has(ids[i]+"|"+ids[j])) aristas.push({o:ids[i], d:ids[j], tipo:"coocurrencia", etiqueta:""});
  }
  EXPANDIDOS.forEach(function(id){
    if(!nodos.has(id)) return;
    (INDICE_ENTIDAD.get(id)||[]).forEach(function(otroId){
      if(otroId === art.id) return;
      var otro = null;
      for(var k=0;k<ARTICULOS.length;k++){ if(ARTICULOS[k].id === otroId){ otro = ARTICULOS[k]; break; } }
      if(!otro) return;
      var clave = "ART::" + otroId;
      if(!nodos.has(clave)){
        nodos.set(clave, {id:clave, nombre:String(otro.titulo||otroId).slice(0,40),
          tipo:"NOTICIA", externo:true, peso:1, articulo:otroId});
      }
      aristas.push({o:id, d:clave, tipo:"puente", etiqueta:"también aquí"});
    });
  });
  return {nodos:Array.from(nodos.values()), aristas:aristas};
}

function dibujarGrafo(art, reiniciar){
  if(!art) return;
  var svg = $("#svg"); if(!svg) return;
  var red = construirRed(art), nodos = red.nodos, aristas = red.aristas;
  var W = svg.clientWidth || 800, H = 460;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  nodos.forEach(function(n, i){
    var ang = (i / Math.max(nodos.length,1)) * Math.PI * 2;
    var rad = Math.min(W,H) * (n.externo ? 0.42 : 0.24);
    if(reiniciar || n.x === undefined){
      n.x = W/2 + Math.cos(ang)*rad; n.y = H/2 + Math.sin(ang)*rad;
    }
    n.vx = 0; n.vy = 0; n.fijo = false;
  });

  var porId = new Map(nodos.map(function(n){ return [n.id, n]; }));
  function radio(n){ return n.externo ? 7 : Math.min(16, 7 + Math.sqrt(n.peso) * 2.4); }
  var explicitas = aristas.filter(function(a){ return a.tipo === "explicita"; });

  svg.innerHTML =
    '<g>' + aristas.map(function(a,i){
      return '<line class="arista '+a.tipo+'" data-i="'+i+'"'
        + (a.tipo==="coocurrencia" ? ' opacity="0.28"' : "") + '></line>'; }).join("") + '</g>'
  + '<g>' + explicitas.map(function(a,i){
      return '<text class="arista-tit" data-e="'+i+'">'+esc(a.etiqueta)+'</text>'; }).join("") + '</g>'
  + '<g>' + nodos.map(function(n){
      return '<g class="nodo '+(n.externo?"externo":"")+'" data-id="'+esc(n.id)+'" tabindex="0" role="button">'
        + '<circle r="'+radio(n)+'" fill="'+(n.externo ? "var(--fondo)" : (COLOR[n.tipo]||"var(--otro)"))+'"></circle>'
        + '<text dy="'+(radio(n)+11)+'" text-anchor="middle">'+esc(String(n.nombre).slice(0,26))+'</text>'
        + '<title>'+esc(n.nombre)+(n.externo?" (otra noticia)":"")+'</title></g>'; }).join("") + '</g>';

  var lineas = Array.prototype.slice.call(svg.querySelectorAll("line"));
  var textos = Array.prototype.slice.call(svg.querySelectorAll(".arista-tit"));
  var grupos = Array.prototype.slice.call(svg.querySelectorAll(".nodo"));
  var arrastrando = null, ciclos = 0;

  function paso(){
    var i, j;
    for(i=0;i<nodos.length;i++) for(j=i+1;j<nodos.length;j++){
      var a = nodos[i], b = nodos[j];
      var dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx+dy*dy || 0.01;
      if(d2 > 90000) continue;
      var d = Math.sqrt(d2), f = 2600/d2, ux = dx/d, uy = dy/d;
      if(!a.fijo){ a.vx -= ux*f; a.vy -= uy*f; }
      if(!b.fijo){ b.vx += ux*f; b.vy += uy*f; }
    }
    aristas.forEach(function(ar){
      var a = porId.get(ar.o), b = porId.get(ar.d); if(!a || !b) return;
      var k = ar.tipo==="explicita" ? 0.012 : (ar.tipo==="puente" ? 0.006 : 0.0016);
      var largo = ar.tipo==="puente" ? 150 : 96;
      var dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      var f = (d-largo)*k, ux = dx/d, uy = dy/d;
      if(!a.fijo){ a.vx += ux*f; a.vy += uy*f; }
      if(!b.fijo){ b.vx -= ux*f; b.vy -= uy*f; }
    });
    nodos.forEach(function(n){
      if(n.fijo) return;
      n.vx += (W/2 - n.x) * 0.0016; n.vy += (H/2 - n.y) * 0.0016;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += Math.max(-18, Math.min(18, n.vx));
      n.y += Math.max(-18, Math.min(18, n.vy));
      var r = radio(n) + 22;
      n.x = Math.max(r, Math.min(W-r, n.x));
      n.y = Math.max(r+6, Math.min(H-r-6, n.y));
    });
    lineas.forEach(function(ln, i){
      var a = porId.get(aristas[i].o), b = porId.get(aristas[i].d); if(!a || !b) return;
      ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y);
      ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
    });
    textos.forEach(function(tx, i){
      var a = porId.get(explicitas[i].o), b = porId.get(explicitas[i].d); if(!a || !b) return;
      tx.setAttribute("x", (a.x+b.x)/2); tx.setAttribute("y", (a.y+b.y)/2 - 4);
      tx.setAttribute("text-anchor", "middle");
    });
    grupos.forEach(function(g){
      var n = porId.get(g.dataset.id); if(!n) return;
      g.setAttribute("transform", "translate("+n.x.toFixed(1)+","+n.y.toFixed(1)+")");
    });
  }

  clearInterval(sim);
  sim = setInterval(function(){
    paso(); if(++ciclos > 900 && !arrastrando) clearInterval(sim);
  }, 26);

  function punto(ev){
    var r = svg.getBoundingClientRect();
    var t = ev.touches && ev.touches.length ? ev.touches[0] : ev;
    return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
  }
  grupos.forEach(function(g){
    function iniciar(ev){
      var n = porId.get(g.dataset.id); if(!n) return;
      arrastrando = n; n.fijo = true; svg.classList.add("arrastrando");
      clearInterval(sim); ciclos = 0; sim = setInterval(paso, 26);
      ev.preventDefault();
    }
    function abrir(){
      var n = porId.get(g.dataset.id); if(!n) return;
      if(n.externo && n.articulo) seleccionar(n.articulo); else alternarExpansion(n.id);
    }
    g.addEventListener("mousedown", iniciar);
    g.addEventListener("touchstart", iniciar, {passive:false});
    g.addEventListener("dblclick", abrir);
    g.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); abrir(); }
    });
  });
  function mover(ev){
    if(!arrastrando) return;
    var p = punto(ev);
    arrastrando.x = p.x; arrastrando.y = p.y;
    arrastrando.vx = 0; arrastrando.vy = 0;
    ev.preventDefault();
  }
  function soltar(){
    if(!arrastrando) return;
    arrastrando.fijo = false; arrastrando = null;
    svg.classList.remove("arrastrando"); ciclos = 0;
  }
  window.addEventListener("mousemove", mover);
  window.addEventListener("touchmove", mover, {passive:false});
  window.addEventListener("mouseup", soltar);
  window.addEventListener("touchend", soltar);

  var tipos = [];
  nodos.forEach(function(n){ if(!n.externo && tipos.indexOf(n.tipo) === -1) tipos.push(n.tipo); });
  $("#leyenda").innerHTML = tipos.map(function(t){
    return '<span><i class="punto" style="background:'+(COLOR[t]||"var(--otro)")+'"></i>'
      + esc(ETIQUETA_TIPO[t]||t)+'</span>'; }).join("")
    + '<span><i class="punto" style="background:transparent;border:1px dashed var(--texto-tenue)"></i>Otra noticia</span>'
    + '<span style="margin-left:auto">'+nodos.length+' nodos · '+explicitas.length+' relaciones explícitas</span>';
}

document.getElementById("q").addEventListener("input", pintarLista);
cargar();
</script>
</body>
</html>
